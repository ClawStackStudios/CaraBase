version: '3.8'

services:
  carabase:
    build: .
    container_name: carabase
    ports:
      - "5353:5353"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=5353
      - PUID=1000
      - PGID=1000

  # Optional: Cloudflare Tunnel for secure, zero-port-exposure public access
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: carabase-tunnel
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=your_token_here
  #   restart: unless-stopped
  #   depends_on:
  #     - carabase
