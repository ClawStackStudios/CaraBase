<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CaraBase Documentation | ClawStack Studios©™</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="CaraBase: The Lobsterized©™ BaaS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Theme: vue, buble, dark, or custom -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <!-- Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --theme-color: #f59e0b; /* Amber */
      --background-color: #030712; /* Tailwind gray-950 */
      --sidebar-bg: #111827; /* Tailwind gray-900 */
      --sidebar-color: #9ca3af;
      --text-color: #d1d5db; /* Tailwind gray-300 */
      --heading-color: #f3f4f6;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
    }
    
    /* Sidebar Styling */
    .sidebar {
      background-color: var(--sidebar-bg);
      color: var(--sidebar-color);
      border-right: 1px solid #1f2937;
    }
    .sidebar h1 {
      color: #f59e0b;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    .sidebar ul li a {
      font-size: 14px;
      transition: color 0.2s ease;
    }
    .sidebar ul li a:hover {
      color: #f3f4f6;
    }
    .sidebar ul li.active > a {
      color: #f59e0b;
      border-right: 2px solid #f59e0b;
      font-weight: 600;
    }

    /* Content Styling */
    .markdown-section a {
      color: #14b8a6; /* Teal */
      font-weight: 500;
      text-decoration: none;
    }
    .markdown-section a:hover {
      text-decoration: underline;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      color: var(--heading-color);
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .markdown-section hr {
      border: none;
      border-bottom: 1px solid #1f2937;
    }

    /* Code Blocks & Inline Code (Shadcn aesthetic) */
    .markdown-section pre {
      background-color: #0f172a !important; /* Slate 900 */
      border: 1px solid #1e293b; /* Slate 800 */
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .markdown-section code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background-color: #1f2937;
      color: #e5e7eb;
      border-radius: 4px;
      padding: 0.2em 0.4em;
      font-size: 0.875em;
    }
    .markdown-section pre > code {
      background-color: transparent;
      padding: 0;
    }

    /* Blockquotes / Alerts */
    .markdown-section blockquote {
      border-left: 4px solid #14b8a6; /* Teal border */
      background-color: rgba(20, 184, 166, 0.1); /* Translucent teal */
      color: #cbd5e1;
      padding: 1rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }
    .markdown-section blockquote > p {
      margin: 0;
      font-weight: 500;
    }

    
    /* Hamburger Menu Positioning */
    body .sidebar-toggle {
      bottom: unset !important;
      top: 15px !important;
      left: 260px !important;
      background: rgba(17, 24, 39, 0.8) !important;
      border-radius: 4px;
      transition: left 0.25s ease-out !important;
      z-index: 100 !important;
    }
    body.close .sidebar-toggle {
      left: 15px !important;
    }
    body .sidebar-toggle span {
      background-color: #f59e0b !important; /* Amber brand color */
    }
  </style>
</head>
<body>
  <div id="app">Loading CaraBase Docs... 🦞</div>
  <script>
    window.$docsify = {
      name: 'CaraBase',
      repo: 'https://github.com/', // Replace with actual Github URL later
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000, 
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No Results!',
        depth: 3
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Code Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
